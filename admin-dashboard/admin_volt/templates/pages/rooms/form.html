{% extends 'layouts/base.html' %}
{% block content %}
<div class="py-4 d-flex justify-content-between align-items-center">
  <h2 class="h4">{% if mode == 'create' %}New Room{% else %}Edit Room{% endif %}</h2>
  <a href="{% url 'volt_room_list' %}" class="btn btn-outline-secondary btn-sm">Back</a>
</div>
<div class="card border-0 shadow">
  <div class="card-body">
    <form method="post" class="row g-3">
      {% csrf_token %}
      {{ form.as_p }}
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary">Save</button>
        <a href="{% url 'volt_room_list' %}" class="btn btn-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
