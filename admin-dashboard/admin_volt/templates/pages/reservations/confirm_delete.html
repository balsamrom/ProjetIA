{% extends 'layouts/base.html' %}
{% block content %}
<div class="py-4">
  <h2 class="h4">Delete Reservation</h2>
</div>
<div class="card border-0 shadow">
  <div class="card-body">
    <p>Are you sure you want to delete the reservation for <strong>{{ reservation.customer_name }}</strong> (room {{ reservation.room.name }}, hotel {{ reservation.room.hotel.name }})?</p>
    <form method="post" class="d-flex gap-2">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger">Confirm Delete</button>
      <a href="{% url 'volt_reservation_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
