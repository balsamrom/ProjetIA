{% extends 'layouts/base.html' %}
{% block content %}
<div class="py-4 d-flex justify-content-between align-items-center">
  <h2 class="h4">{% if mode == 'create' %}Nouveau contenu{% else %}Modifier contenu{% endif %}</h2>
  <a href="{% url 'volt_multimedia_list' %}" class="btn btn-outline-secondary btn-sm">Retour</a>
</div>
<div class="card border-0 shadow">
  <div class="card-body">
    <form method="post" enctype="multipart/form-data" class="row g-3">
      {% csrf_token %}
      {{ form.as_p }}
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary">Enregistrer</button>
        <a href="{% url 'volt_multimedia_list' %}" class="btn btn-secondary">Annuler</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
