{% extends 'layouts/base.html' %}
{% block content %}
<div class="py-4">
  <h2 class="h4">Delete Review</h2>
</div>
<div class="card border-0 shadow">
  <div class="card-body">
    <p>Are you sure you want to delete this review by <strong>{{ review.user.username }}</strong> for hotel <strong>{{ review.hotel.name }}</strong>?</p>
    <blockquote class="blockquote"><small>{{ review.review_text }}</small></blockquote>
    <form method="post" class="d-flex gap-2">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger">Confirm Delete</button>
      <a href="{% url 'volt_review_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
