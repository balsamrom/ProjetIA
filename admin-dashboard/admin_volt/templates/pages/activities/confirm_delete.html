{% extends 'layouts/base.html' %}

{% block content %}

  <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center py-4">
    <div class="d-block mb-4 mb-md-0">
      <h2 class="h4">Supprimer une activité</h2>
    </div>
  </div>

  <div class="card border-0 shadow">
    <div class="card-body">
      <h5 class="card-title">Confirmation de suppression</h5>
      <p class="text-danger">Voulez-vous vraiment supprimer l'activité « <strong>{{ activity.activity_name }}</strong> » ?</p>
      <p class="text-muted">Cette action est irréversible.</p>
      
      <form id="vvDelForm" method="post">
        {% csrf_token %}
        <a href="{% url 'transaction' %}" class="btn btn-outline-secondary">Annuler</a>
        <button type="button" id="vvDelBtn" class="btn btn-danger">Supprimer</button>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script>
    const btn = document.getElementById('vvDelBtn');
    const form = document.getElementById('vvDelForm');
    if(btn){
      btn.addEventListener('click', function(){
        Swal.fire({
          title: 'Confirmer la suppression',
          text: 'Êtes-vous sûr de vouloir supprimer cette activité ?',
          icon: 'warning',
          showCancelButton: true,
          confirmButtonColor: '#d33',
          cancelButtonColor: '#6b7280',
          confirmButtonText: 'Oui, supprimer',
          cancelButtonText: 'Annuler'
        }).then((result) => {
          if (result.isConfirmed) {
            form.submit();
          }
        })
      });
    }
  </script>

{% endblock content %}
