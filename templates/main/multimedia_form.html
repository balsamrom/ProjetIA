<!DOCTYPE html>
<html lang="fr">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajouter un contenu</title>
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <link rel="stylesheet" href="{% static 'css/Home CSS/mobile.css' %}">
    <style>
        :root{
            --vv-primary: #6B4F3B;
            --vv-primary-light:#5c4433;
            --vv-secondary: #F2C94C;
            --vv-secondary-dark:#E0B73A;
            --vv-accent:#6B4F3B;
            --vv-white:#FFFFFF;
            --vv-gray-50:#FFF8E7;
        }
        .container{
            max-width: 700px; margin: 2rem auto; padding: 2rem;
            background: #fff; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }
        .container h1{ margin-bottom: 1rem; }
        label{ font-weight: 600; color: #333; }
        input[type="file"], textarea{
            width: 100%; border: 1px solid #e5e7eb; border-radius: 10px; padding: 0.75rem;
            background: #fff; transition: box-shadow .2s ease, border-color .2s ease;
        }
        textarea{ min-height: 140px; }
        input[type="file"]:focus-visible, textarea:focus-visible{
            outline: none; border-color: var(--vv-secondary); box-shadow: 0 0 0 3px rgba(242,201,76,0.35);
        }
        .btn{ display: inline-flex; align-items: center; gap: .5rem; font-weight: 600; border: 0; cursor: pointer;
            border-radius: 999px; padding: .75rem 1.25rem; text-decoration: none; transition: transform .2s ease, box-shadow .2s ease; }
        .btn:focus-visible{ outline: 3px solid var(--vv-secondary); outline-offset: 2px; }
        .btn-primary{ color: var(--vv-white); background: linear-gradient(45deg, var(--vv-secondary), var(--vv-secondary-dark));
            box-shadow: 0 4px 15px rgba(224,183,58,.35); }
        .btn-primary:hover{ transform: translateY(-2px); box-shadow: 0 6px 20px rgba(224,183,58,.45); }
        .btn-secondary{ color: var(--vv-white); background: linear-gradient(45deg, var(--vv-primary), var(--vv-primary-light)); }
        .btn-secondary:hover{ transform: translateY(-2px); box-shadow: 0 6px 20px rgba(107,79,59,.25); }
        .actions{ margin-top: .5rem; display:flex; align-items:center; gap:.75rem; }
    </style>
</head>
<body>
    <section class="nav-bar" style="z-index: 1000;">
        <div class="logo"><a href="/">VoyageVue</a></div>
        <ul class="menu">
            <li><a href="/">Home</a></li>
            <li><a href="/travels">travels</a></li>
            <li><a href="/contact">Contact</a></li>
            <li><a href="/multimedia">Multimédia</a></li>
            {% if user.is_authenticated %}
            <li><a href="/profile">Profile</a></li>
            <li><a href="/logout">logout</a></li>
            {% else %}
            <li><a href="/signin">Sign In</a></li>
            <li><a href="/signup">Sign Up</a></li>
            {% endif %}
        </ul>
        <div class="mobile">
            <i class="fa-solid fa-bars"></i>
        </div>
    </section>

    <div class="container">
        <h1>Ajouter un contenu</h1>
        <form method="post" enctype="multipart/form-data" style="display:flex;flex-direction:column;gap:1rem;">
            {% csrf_token %}
            <div>
                <label for="title">Titre</label><br>
                <input type="text" id="title" name="title" placeholder="Titre de votre publication" />
            </div>
            <div>
                <label for="image">Image (optionnel)</label><br>
                <input type="file" id="image" name="image" accept="image/*" />
            </div>
            <div>
                <label for="comment">Commentaire</label><br>
                <textarea id="comment" name="comment" rows="5"></textarea>
            </div>
            <div class="actions">
                <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Enregistrer</button>
                <a href="/multimedia" class="btn btn-secondary"><i class="fas fa-times"></i> Annuler</a>
            </div>
        </form>
    </div>
</body>
</html>
