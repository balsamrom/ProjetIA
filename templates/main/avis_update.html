<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modifier le contenu</title>
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/Home CSS/mobile.css">
</head>
<body>
    <section class="nav-bar" style="z-index: 1000;">
        <div class="logo"><a href="/">VoyageVue</a></div>
        <ul class="menu">
            <li><a href="/">Home</a></li>
            <li><a href="/travels">travels</a></li>
            <li><a href="/multimedia">Multimédia</a></li>
            {% if user.is_authenticated %}
            <li><a href="/profile">Profile</a></li>
            <li><a href="/logout">logout</a></li>
            {% else %}
            <li><a href="/signin">Sign In</a></li>
            <li><a href="/signup">Sign Up</a></li>
            {% endif %}
        </ul>
        <div class="mobile">
            <i class="fa-solid fa-bars"></i>
        </div>
    </section>

    <div class="container" style="max-width: 640px; margin: 2rem auto; padding: 1rem;">
        <h1 style="margin-bottom: 1rem;">Modifier le contenu</h1>
        <form method="post" enctype="multipart/form-data" style="display:flex;flex-direction:column;gap:1rem;">
            {% csrf_token %}
            {% if avis.image %}
            <img src="{{ avis.image.url }}" alt="image" style="width:100%;max-height:280px;object-fit:cover;border-radius:8px;" />
            {% endif %}
            <div>
                <label for="image">Changer l'image (optionnel)</label><br>
                <input type="file" id="image" name="image" accept="image/*" />
            </div>
            <div>
                <label for="comment">Commentaire</label><br>
                <textarea id="comment" name="comment" rows="5" style="width:100%;">{{ avis.comment }}</textarea>
            </div>
            <div>
                <button type="submit" style="background:#2ecc71;color:white;border:0;border-radius:6px;padding:0.6rem 1rem;cursor:pointer;">Enregistrer</button>
                <a href="/multimedia" style="margin-left:0.5rem;">Annuler</a>
            </div>
        </form>
    </div>
</body>
</html>
