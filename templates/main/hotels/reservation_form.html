{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Nouvelle Réservation</title>
    <link rel="stylesheet" href="{% static 'css/Home CSS/style.css' %}" />
    <link rel="stylesheet" href="{% static 'css/voguevue-theme.css' %}">
</head>
<body>
    <section class="nav-bar">
        <div class="logo"><a href="/">VogueVue</a></div>
        <ul class="menu">
            <li><a href="/">Accueil</a></li>
            <li><a href="/rooms">Chambres</a></li>
        </ul>
    </section>
    <div class="container" style="max-width:760px;margin:20px auto;">
        <h1 style="text-align:center;color:#6B4F3B">Nouvelle Réservation</h1>
        <style>
          :root{ --vv-brown:#6B4F3B; --vv-yellow:#F2C94C; --vv-yellow-600:#E0B73A; --vv-cream:#FFF8E7; --vv-white:#FFFFFF; }
          body{ background: var(--vv-cream); }
          form.vv-form{ background: var(--vv-white); padding:20px; border-radius:12px; border:1px solid rgba(107,79,59,.15); box-shadow:0 6px 16px rgba(107,79,59,.08); display:grid; gap:12px; }
          .vv-actions{ display:flex; gap:10px; }
          .btn{ background:#6B4F3B; color:#fff; border:none; border-radius:10px; padding:10px 14px; text-decoration:none; }
          .btn-primary{ background: var(--vv-yellow); color: var(--vv-brown); }
          .btn-primary:hover{ background: var(--vv-yellow-600); }
          .btn-secondary{ background:#6B4F3B; }
          input[type=date], select, input, textarea{ border:1px solid rgba(107,79,59,.25); border-radius:10px; padding:8px 10px; width:100%; }
          label{ font-weight:600; color:#5c4433; }
        </style>
        <form method="post" class="vv-form">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="vv-actions">
                <button class="btn btn-primary" type="submit">Confirmer la réservation</button>
                <a class="btn btn-secondary" href="/hotels">Annuler</a>
            </div>
        </form>
    </div>
</body>
</html>
