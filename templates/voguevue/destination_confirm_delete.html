{% extends 'voguevue/base.html' %}

{% block title %}Supprimer Destination{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-danger">
                <div class="card-header bg-danger text-white">
                    <h4 class="mb-0">⚠️ Confirmation de suppression</h4>
                </div>
                <div class="card-body text-center">
                    <p class="fs-5">Êtes-vous sûr de vouloir supprimer :</p>
                    <h5 class="text-danger mb-4">"{{ destination.destination }}" ?</h5>
                    <p class="text-muted"><small>Cette action est irréversible.</small></p>
                    
                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex justify-content-center gap-2">
                            <button type="submit" class="btn btn-danger">
                                ✅ Oui, supprimer
                            </button>
                            <a href="{% url 'destination_list' %}" class="btn btn-secondary">
                                ❌ Annuler
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
